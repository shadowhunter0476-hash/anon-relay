
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANON RELAY</title>
<style>
body{background:#05060a;color:#00f0ff;font-family:monospace;padding:20px;max-width:460px;margin:0 auto}
h1{color:#ff2bd6;letter-spacing:.2em;font-size:16px}
input,textarea,button{width:100%;padding:11px;margin:6px 0;background:#04050a;color:#00f0ff;border:1px solid rgba(0,240,255,.3);border-radius:8px;font-family:inherit;box-sizing:border-box}
textarea{height:90px}
button{background:#00f0ff;color:#000;font-weight:800;cursor:pointer}
button:hover{box-shadow:0 0 18px #00f0ff}
pre{background:#04050a;border:1px solid rgba(0,240,255,.2);padding:10px;border-radius:8px;font-size:10px;max-height:200px;overflow:auto}
</style></head><body>
<h1>ANON RELAY</h1>
<button onclick="c()">NEW TOKEN</button>
<input id="t" placeholder="token">
<textarea id="m" placeholder="message..."></textarea>
<button onclick="s()">SEND ANON</button>
<button onclick="r()">RECEIVE</button>
<pre id="o">idle</pre>
<script>
async function c(){const x=await fetch('/api/create',{method:'POST'});const j=await x.json();document.getElementById('t').value=j.token;document.getElementById('o').textContent='token: '+j.token}
async function s(){const t=document.getElementById('t').value,m=document.getElementById('m').value;if(!t||!m)return alert('token+msg');const x=await fetch('/api/send/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});document.getElementById('o').textContent=JSON.stringify(await x.json())}
async function r(){const t=document.getElementById('t').value;if(!t)return alert('token');const x=await fetch('/api/recv/'+t);document.getElementById('o').textContent=JSON.stringify(await x.json(),null,2)}
</script></body></html>
